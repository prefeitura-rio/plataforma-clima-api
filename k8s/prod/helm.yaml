apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prefeitura-rio-api-prod
spec:
  type: oci
  interval: 10m
  url: oci://ghcr.io/prefeitura-rio/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plataforma-clima-api-prod
spec:
  interval: 10m
  releaseName: plataforma-clima-api-prod
  chart:
    spec:
      chart: base-chart
      version: 2.4.20
      sourceRef:
        kind: HelmRepository
        name: prefeitura-rio-api-prod
  values:
    fullnameOverride: plataforma-clima-api-prod
    image:
      repository: ghcr.io/prefeitura-rio/plataforma-clima-api
      tag: prod-2 # {"$imagepolicy": "plataforma-clima:plataforma-clima-api-prod:tag"}
      pullPolicy: IfNotPresent
    service:
      port: 80
      containerPort: 80
    livenessProbe:
      httpGet:
        path: /health
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 60
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    podSecurityContext:
      runAsNonRoot: false
    envFrom:
      - secretRef:
          name: plataforma-clima-api-prod-infisical
    replicaCount: 1
    autoscaling:
      enabled: false
    istio:
      enabled: false
    ingress:
      enabled: false
    podDisruptionBudget:
      enabled: false
    flux:
      policy:
        semver: null
        numerical:
          order: asc
      filterTags:
        pattern: ^prod-(?P<n>[0-9]+)$
        extract: $n
      imageUpdateOverwrite:
        git:
          branch: main
